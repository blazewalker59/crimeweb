# Cloudflare Workers configuration for CrimeWeb
name = "crimeweb"
# Custom entry: the TanStack Start fetch handler plus a scheduled
# handler for ingest. See src/worker.ts.
main = "src/worker.ts"
compatibility_date = "2025-01-04"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
# Used by better-auth to build OAuth callback URLs. Not a secret.
BETTER_AUTH_URL = "https://crimeweb.blazewalker59.workers.dev"
# The invite list. Enforced in the OAuth callback after Google resolves the
# email — see ADR-0002. Comma-separated, no spaces.
ALLOWLIST_EMAILS = "blazewalker59@gmail.com"

# Binding name follows dinnertable (`DB`), not wrangler's suggested
# `crimeweb_db`, so the auth and query code ports across unchanged.
[[d1_databases]]
binding = "DB"
database_name = "crimeweb-db"
database_id = "e9c41ba6-1225-47ca-934c-6cfbec4f9cf4"
migrations_dir = "drizzle"

# Used for ingest-time case-attribute extraction — see ADR-0003.
[ai]
binding = "AI"
# Workers AI has no local implementation — `wrangler dev --local` fails with
# "Binding AI needs to be run remotely". `remote = true` proxies just this
# binding to the real service during local dev (D1 stays local) and suppresses
# wrangler's usage-charge warning. Note --local disables remote bindings
# entirely, so use plain `wrangler dev` when exercising extraction.
remote = true

# Secrets are set out-of-band with `wrangler secret put` and persist across
# deploys; nothing is uploaded per-deploy (see .github/workflows/ci.yml).
# - TMDB_API_KEY
# - TMDB_API_READ_ACCESS_TOKEN
# - BETTER_AUTH_SECRET
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET

# Ingest cadence. Refresh is daily; discovery is weekly and lands in #27.
[triggers]
crons = ["0 6 * * *"]

[dev]
port = 8788
